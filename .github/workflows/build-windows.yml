name: Build Windows

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ffmpeg-python>=0.2.0" "flet>=0.22.0,<0.23.0" "pillow>=10.2.0" pyinstaller

      - name: Download Windows ffmpeg into vendors/for_Win
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '9.0.1'
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$ver/ffmpeg-$ver-essentials_build.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg-essentials.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-essentials'
          Write-Host "Downloading $url"
          curl.exe -L --retry 3 --retry-delay 5 -o $zip $url
          if (-not (Test-Path $zip) -or ((Get-Item $zip).Length -lt 1MB)) {
            throw "ffmpeg zip download failed"
          }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem -Path $extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) {
            throw "ffmpeg.exe not found in downloaded zip"
          }
          $src = $ffmpeg.DirectoryName
          $dest = Join-Path $PWD 'vendors\for_Win'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          foreach ($name in @('ffmpeg.exe', 'ffprobe.exe', 'ffplay.exe')) {
            $from = Join-Path $src $name
            if (-not (Test-Path $from)) {
              throw "$name not found in $($src)"
            }
            Copy-Item -Path $from -Destination (Join-Path $dest $name) -Force
          }
          Get-ChildItem $dest | Format-Table Name, Length

      - name: Build with PyInstaller
        run: python build.py

      - name: Verify Windows payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'dist\nfc-rename'
          $exe = Join-Path $root 'nfc-rename.exe'
          $ffmpeg = Join-Path $root 'vendors\for_Win\ffmpeg.exe'
          $ffprobe = Join-Path $root 'vendors\for_Win\ffprobe.exe'
          foreach ($path in @($exe, $ffmpeg, $ffprobe)) {
            if (-not (Test-Path $path)) {
              throw "missing: $path"
            }
          }
          Write-Host "Verified:"
          Get-Item $exe, $ffmpeg, $ffprobe | Format-Table FullName, Length

      - name: Zip dist/nfc-rename
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD 'nfc-rename-windows.zip'
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path (Join-Path $PWD 'dist\nfc-rename') -DestinationPath $zip
          Get-Item $zip | Format-Table Name, Length

      - name: Upload nfc-rename-windows.zip
        uses: actions/upload-artifact@v4
        with:
          name: nfc-rename-windows
          path: nfc-rename-windows.zip
          if-no-files-found: error
